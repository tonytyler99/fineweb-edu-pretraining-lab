[project]
name = "fineweb-edu-pretraining-lab"
version = "0.0.1"
description = "Reproducible GPT pretraining pipeline on the FineWeb-Edu dataset."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Berkin Kabaağaç", email = "berkin99@gmail.com" },
]
keywords = ["pretraining", "gpt", "fineweb", "llm", "pytorch"]

# numpy is pinned <2.0 because torch 2.3.x wheels on Windows are still built
# against the numpy 1.x ABI. Bump once we move to torch 2.4+.
dependencies = [
    "torch>=2.3,<3.0",
    "datasets>=2.20",
    "tiktoken>=0.7",
    "numpy<2.0",
    "wandb>=0.17",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "einops>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# PyTorch CUDA wheels are not on PyPI. We declare an explicit index for the
# cu121 wheels and bind only `torch` to it via [tool.uv.sources]; every other
# dependency still resolves from the default index. `explicit = true` prevents
# uv from leaking unrelated packages onto the PyTorch index.

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
